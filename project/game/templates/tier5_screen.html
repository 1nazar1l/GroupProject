<section class="screen tier5_shop shop active_shop active">
    <div class="image-container">
        <img src="../../media/tier5_shop.jpg" alt="" class="background">
        <div class="content">
            <button class="pause-btn btn">
                <span></span>
                <span></span>
            </button>
            <section class="money-info">
                <img src="../../media/icons/money.png" alt="">
                <div class="money-content"></div>
                <span class="money">{{ save.capital }}</span>
                <span class="money-per-second">0.1</span>
            </section>
            <div class="minimap-icon">
                <img src="../../media/icons/square-back.png" alt="" class="back">
                <img src="../../media/icons/icon_map.png" alt="" class="icon">
            </div>
            <div class="map-block">
                <img src="../../media/icons/square-back.png" alt="" class="back">
                <img src="../../media/icons/square-border.png" alt="" class="border">
                <img src="../../media/map.jpg" alt="" class="map">

                <div class="click_area bank-area">
                    <form action="{% url "bank" %}" method="post">
                        {% csrf_token %}
                        <input type="hidden" name="key" value={{save_key}}>
                        <button></button>
                    </form>
                </div>
                <div class="click_area casino-area">
                    <form action="{% url "casino" %}" method="post">
                        {% csrf_token %}
                        <input type="hidden" name="key" value={{save_key}}>
                        <button></button>
                    </form>
                </div>
                <div class="click_area shop-area"></div>
            </div>
            {% include "tablet.html" with gamestate='wait' %}
            {% if progress_bar_width == 100 %}
            <div class="next-tier-btn">
                <form action="{% url "next_tier" %}" method="post" id="nextTierForm">
                    {% csrf_token %}
                    <button type="submit"></button>
                    <input type="hidden" name="key" value={{save_key}}>
                    <input type="hidden" name="next_tier" value="tier4">
                    <input name="money" type="hidden" id="money" value="{{save.capital}}">
                    <div class="next-tier-btn-block">
                        <img src="../../media/icons/rect-back.png" alt="">
                        <span>Новый уровень</span>
                    </div>
                </form>
            </div>
            {% else %}
                {% include "progress-bar.html" %}
            {% endif %}
            <div class="start-day-btn">
                <img src="../../media/icons/rect-back.png" alt="">
                <span>Начать день</span>
                <form action="{% url "gameplay" %}" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="key" value={{save_key}}>
                    <button></button>
                </form>
            </div>
        </div>
    </div>
</section>

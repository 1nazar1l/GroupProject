{% if state == 'game' %}
    <div class="map-block">
        <img src="../../media/icons/square-back.png" alt="" class="back">
        <img src="../../media/icons/square-border.png" alt="" class="border">
        <img src="../../media/map.jpg" alt="" class="map">

        <div class="click_area bank-area">
            <form action="{% url "bank" %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="key" value={{save_key}}>
                <button></button>
            </form>
        </div>
        <div class="click_area casino-area">

                {% csrf_token %}
                <input type="hidden" name="key" value={{save_key}}>
                <button></button>
            </form>
        </div>
        <div class="click_area shop-area"></div>
    </div>
